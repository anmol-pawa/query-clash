itle><meta name="description" content="A 1v1 action battle game that teaches SQL from SELECT to recursive CTEs in both Oracle and PostgreSQL. Your queries are your spells."/><link rel="manifest" href="/query-clash/manifest.webmanifest"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Query Clash"/><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/><link rel="icon" href="/query-clash/icon.png?icon.34yeac6_qe87q.png" sizes="64x64" type="image/png"/><link rel="apple-touch-icon" href="/query-clash/apple-icon.png?apple-icon.2ke5k6v36r12s.png" sizes="180x180" type="image/png"/><script src="/query-clash/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-full"><div hidden=""><!--$--><!--/$--></div><main class="mx-auto max-w-6xl px-4 py-6"><header class="flex flex-wrap items-center gap-4"><a class="text-sm text-white/60 transition-colors hover:text-white " href="/query-clash/">← Menu</a><h1 class="font-display text-xl font-bold tracking-[0.25em]">CODEX</h1><span class="text-xs text-white/40">3<!-- -->/<!-- -->61<!-- --> unlocked · <!-- -->0<!-- --> quizzes mastered</span><label class="ml-auto flex cursor-pointer items-center gap-2 text-xs text-white/60"><input type="checkbox" class="accent-[var(--accent)]"/>Study mode (show locked entries)</label></header><div class="mt-5 flex flex-wrap items-center gap-2"><button class="rounded-lg px-3 py-1 text-xs font-semibold transition-colors bg-[var(--accent)] text-black">All</button><button class="rounded-lg px-3 py-1 text-xs font-semibold transition-colors bg-white/5 text-white/60 hover:bg-white/10">Basics</button><button class="rounded-lg px-3 py-1 text-xs font-semibold transition-colors bg-white/5 text-white/60 hover:bg-white/10">Joins</button><button class="rounded-lg px-3 py-1 text-xs font-semibold transition-colors bg-white/5 text-white/60 hover:bg-white/10">Aggregation</button><button class="rounded-lg px-3 py-1 text-xs font-semibold transition-colors bg-white/5 text-white/60 hover:bg-white/10">Subqueries</button><button class="rounded-lg px-3 py-1 text-xs font-semibold transition-colors bg-white/5 text-white/60 hover:bg-white/10">DML</button><button class="rounded-lg px-3 py-1 text-xs font-semibold transition-colors bg-white/5 text-white/60 hover:bg-white/10">Transactions</button><button class="rounded-lg px-3 py-1 text-xs font-semibold transition-colors bg-white/5 text-white/60 hover:bg-white/10">DDL</button><button class="rounded-lg px-3 py-1 text-xs font-semibold transition-colors bg-white/5 text-white/60 hover:bg-white/10">Analytics</button><button class="rounded-lg px-3 py-1 text-xs font-semibold transition-colors bg-white/5 text-white/60 hover:bg-white/10">Hierarchies</button><button class="rounded-lg px-3 py-1 text-xs font-semibold transition-colors bg-white/5 text-white/60 hover:bg-white/10">Performance</button><button class="rounded-lg px-3 py-1 text-xs font-semibold transition-colors bg-white/5 text-white/60 hover:bg-white/10">Modern SQL</button><input placeholder="Search…" class="ml-auto w-48 rounded-lg border border-white/10 bg-black/40 px-3 py-1.5 text-sm outline-none focus:border-[var(--accent)]" value=""/></div><div class="mt-5 grid gap-3 md:grid-cols-2"><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Basics</span></div><div class="mt-1 font-display text-base font-bold ">SELECT … FROM</div><p class="mt-1 line-clamp-2 text-sm text-white/60 ">SELECT retrieves data. You list the columns (or expressions) you want and, in FROM, the table(s) they come from. The result is itself a table (a result set) with no guaranteed row order.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Basics</span></div><div class="mt-1 font-display text-base font-bold ">WHERE</div><p class="mt-1 line-clamp-2 text-sm text-white/60 ">WHERE filters rows before they reach the result. Only rows for which the condition evaluates to TRUE are kept; rows where it is FALSE or UNKNOWN (because of NULL) are discarded.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Basics</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">ORDER BY</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">ORDER BY sorts the final result by one or more expressions, each ASC (default) or DESC. Later keys break ties in earlier ones. You can also control where NULLs go with NULLS FIRST / NULLS LAST.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Basics</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">DISTINCT</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">SELECT DISTINCT removes duplicate rows from the result. It compares entire rows, not a single column.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Basics</span></div><div class="mt-1 font-display text-base font-bold ">NULL &amp; three-valued logic</div><p class="mt-1 line-clamp-2 text-sm text-white/60 ">NULL means &#x27;unknown or missing&#x27;. Any comparison with NULL yields UNKNOWN, a third truth value, so col = NULL is never true. Test with IS NULL / IS NOT NULL.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Basics</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">IN, BETWEEN, LIKE</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">Shorthand predicates. x IN (a, b) means x = a OR x = b. x BETWEEN lo AND hi is inclusive at both ends. LIKE matches patterns: % is any number of characters, _ is exactly one.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Basics</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">Expressions &amp; aliases</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">SELECT can compute values: arithmetic, function calls, CASE. AS gives an output column a name (an alias). Aliases can be used in ORDER BY, but not in WHERE or GROUP BY (except in PostgreSQL and Oracle 23ai, which allow GROUP BY alias).</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Basics</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">Top-N: FETCH FIRST, LIMIT, ROWNUM</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">Return only the first n rows of an ordered result. The SQL standard form is FETCH FIRST n ROWS ONLY (Oracle 12c+, PostgreSQL). PostgreSQL also has LIMIT; classic Oracle uses the ROWNUM pseudo-column.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Basics</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">Dates &amp; date literals</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">Use ANSI date literals, DATE &#x27;YYYY-MM-DD&#x27;. They are unambiguous in both databases. Range filters on dates should be half-open: &gt;= start AND &lt; next_start.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Joins</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">INNER JOIN</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">An inner join combines rows from two tables where the ON condition is true. Rows with no match on the other side are dropped. JOIN on its own means INNER JOIN.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Joins</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">LEFT / RIGHT OUTER JOIN</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">An outer join keeps every row of one side even when nothing matches; the missing side&#x27;s columns are filled with NULL. LEFT keeps the left table, RIGHT keeps the right table.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Joins</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">Self join</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">A self join joins a table to itself using two aliases. It&#x27;s the classic way to relate rows in the same table, such as an employee and their manager.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Joins</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">Anti-join (find the missing)</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">An anti-join returns rows of A that have no match in B. Write it as LEFT JOIN … WHERE b.key IS NULL, or as NOT EXISTS.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Joins</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">FULL OUTER JOIN &amp; CROSS JOIN</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">FULL OUTER JOIN keeps unmatched rows from both sides. CROSS JOIN pairs every row with every row (a Cartesian product) on purpose.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Aggregation</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">Aggregate functions</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">COUNT, SUM, AVG, MIN and MAX reduce many rows to one value. COUNT(*) counts rows; COUNT(col) counts non-NULL values. All the others ignore NULLs.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Aggregation</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">GROUP BY</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">GROUP BY splits rows into groups that share the same values in the listed columns, then computes one output row per group. Every selected column must be grouped or aggregated.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Aggregation</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">HAVING</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">HAVING filters groups after aggregation, the way WHERE filters rows before it. Conditions on aggregates (COUNT(*) &gt; 3) must go in HAVING.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Aggregation</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">CASE expressions</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">CASE is SQL&#x27;s if/else, returning a value. The searched form, CASE WHEN cond THEN … ELSE … END, checks conditions in order. The simple form, CASE x WHEN 1 THEN …, compares one value against each option.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Aggregation</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">COALESCE, NVL, NULLIF</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">COALESCE(a, b, …) returns the first non-NULL argument. It&#x27;s ANSI SQL and works in both databases. Oracle also has NVL(a, b) and NVL2(x, a, b). NULLIF(a, b) returns NULL when a = b, which is handy for avoiding division by zero.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Subqueries</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">Scalar subquery</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">A subquery that returns exactly one row and one column can be used anywhere a single value can, such as in WHERE comparisons or in the SELECT list.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Subqueries</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">IN (subquery)</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">x IN (SELECT …) is true when x equals any value the subquery returns. Unlike a join, it never duplicates outer rows (it is a semi-join).</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Subqueries</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">Correlated subquery</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">A correlated subquery references columns of the outer query, so it is logically re-evaluated for every outer row. Modern optimizers often rewrite it as a join.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Subqueries</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">EXISTS / NOT EXISTS</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">EXISTS (subquery) is true if the subquery returns at least one row. The database can stop at the first match. What the subquery SELECTs is irrelevant; SELECT 1 is idiomatic.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Subqueries</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">The NOT IN + NULL trap</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">x NOT IN (1, 2, NULL) means x &lt;&gt; 1 AND x &lt;&gt; 2 AND x &lt;&gt; NULL. The last comparison is UNKNOWN, so the whole condition is never TRUE and the query returns zero rows.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Subqueries</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">Inline views (derived tables)</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">A subquery in the FROM clause acts as a temporary, unnamed table. It lets you aggregate first and then join or filter on the aggregate.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Subqueries</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">UNION, INTERSECT, EXCEPT/MINUS</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">Set operators combine the results of two queries with the same number and types of columns. UNION removes duplicates, UNION ALL keeps them. INTERSECT keeps rows present in both. EXCEPT (Oracle: MINUS) keeps rows of the first query that aren&#x27;t in the second.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">DML</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">INSERT</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">INSERT adds rows. Always list the target columns explicitly; columns you omit get their DEFAULT (or NULL).</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">DML</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">INSERT … SELECT</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">Inserts the entire result of a query in one set-based statement. It&#x27;s the backbone of ETL and data migration.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">DML</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">UPDATE</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">UPDATE changes column values in existing rows. The WHERE clause decides which rows change, and it may contain subqueries.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">DML</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">DELETE &amp; referential integrity</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">DELETE removes rows that match WHERE. Foreign keys stop you from deleting parents that still have children, unless the key was declared ON DELETE CASCADE or SET NULL.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">DML</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">MERGE / UPSERT</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">An upsert inserts rows that don&#x27;t exist and updates rows that do, atomically. Oracle uses MERGE (SQL:2003). PostgreSQL has INSERT … ON CONFLICT … DO UPDATE and, since v15, MERGE as well.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Transactions</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">Transactions &amp; ACID</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">A transaction is a unit of work that is Atomic (all or nothing), Consistent (moves from one valid state to another), Isolated (concurrent transactions don&#x27;t see each other&#x27;s partial work) and Durable (committed data survives crashes). COMMIT makes changes permanent; ROLLBACK discards them.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Transactions</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">SAVEPOINT</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">A savepoint marks a point inside a transaction. ROLLBACK TO SAVEPOINT undoes only the work done after it, and the transaction stays open.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Transactions</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">Isolation levels</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">The isolation level controls which anomalies concurrent transactions can observe: dirty reads, non-repeatable reads, phantoms, and write skew. READ COMMITTED is the default in both Oracle and PostgreSQL; SERIALIZABLE is the strictest.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Transactions</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">Row locks: SELECT … FOR UPDATE</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">SELECT … FOR UPDATE locks the rows it returns until the transaction ends, so other transactions can&#x27;t modify them in between (pessimistic locking). NOWAIT fails immediately instead of waiting; SKIP LOCKED skips rows that are already locked.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">DDL</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">CREATE TABLE &amp; data types</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">CREATE TABLE defines a table&#x27;s columns, their data types and their constraints. Picking the right types is the first line of data quality.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">DDL</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">Constraints</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">Constraints are rules the database enforces on every write: PRIMARY KEY (unique and not null), FOREIGN KEY (the value must exist in the parent table), UNIQUE, NOT NULL and CHECK (a boolean rule).</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">DDL</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">ALTER TABLE</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">ALTER TABLE changes a table&#x27;s structure: it adds, drops or renames columns, changes types, and adds or removes constraints.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">DDL</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">Identity columns &amp; sequences</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">A sequence is a database object that hands out unique numbers. An identity column (GENERATED ALWAYS AS IDENTITY) attaches a sequence to a column automatically. It&#x27;s standard SQL in Oracle 12c+ and PostgreSQL 10+.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">DDL</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">Views</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">A view is a named, stored query. Selecting from it runs the query; it holds no data of its own. Simple views can even be updated.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">DDL</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">CREATE TABLE AS SELECT</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">CTAS creates a new table and fills it with a query&#x27;s result in one step. Column names and types come from the query; constraints and indexes do not.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">DDL</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">Normalization</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">Normalization organizes tables so each fact is stored once. 1NF: atomic values. 2NF: no partial dependency on part of a composite key. 3NF: no dependency between non-key columns. It prevents update, insert and delete anomalies.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Analytics</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">Window functions</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">A window function computes a value over a set of rows related to the current row (its window) without collapsing them the way GROUP BY does. OVER (PARTITION BY … ORDER BY … frame) defines the window.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Analytics</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">ROW_NUMBER, RANK, DENSE_RANK</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">Ranking functions number rows inside each partition. ROW_NUMBER is always unique (1,2,3,4). RANK gives ties the same rank and leaves gaps (1,2,2,4). DENSE_RANK gives ties the same rank without gaps (1,2,2,3).</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Analytics</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">Running totals &amp; frames</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">Adding ORDER BY inside OVER turns an aggregate into a cumulative one. Frames refine it: ROWS BETWEEN 2 PRECEDING AND CURRENT ROW gives a 3-row moving window.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Analytics</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">LAG &amp; LEAD</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">LAG(expr, n, default) reads a value from n rows before the current row within the window order; LEAD reads n rows after. It removes the need for self joins when comparing with neighbouring rows.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Analytics</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">Top-N per group</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">Rank rows within each partition in a subquery or CTE, then filter on the rank in the outer query.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Analytics</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">Pivot (rows → columns)</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">Pivoting turns the values of one column into several columns, each holding an aggregate. Oracle has a PIVOT clause. In PostgreSQL you use conditional aggregation with FILTER (or the crosstab extension).</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Hierarchies</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">Common Table Expressions (WITH)</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">WITH name AS (query) defines a named subquery that exists for one statement. CTEs make complex SQL readable as a pipeline of named steps, and a CTE can be referenced more than once.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Hierarchies</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">Recursive CTEs</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">A recursive CTE has an anchor query UNION ALL a recursive query that references the CTE itself. The database repeats the recursive part, feeding each round the rows produced by the previous one, until no new rows appear.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Hierarchies</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">Oracle CONNECT BY</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">Oracle&#x27;s proprietary hierarchical query syntax. START WITH picks the root rows; CONNECT BY PRIOR parent = child links each row to its parent. Pseudo-columns: LEVEL (depth), SYS_CONNECT_BY_PATH (path string), CONNECT_BY_ROOT (value from the root), CONNECT_BY_ISLEAF.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Hierarchies</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">Row generators &amp; calendars</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">To report on values that aren&#x27;t in the data (empty months, missing ids), generate them first and LEFT JOIN the facts onto them.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Performance</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">Indexes</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">An index is a separate data structure, usually a B-tree, that maps key values to row locations so the database can find rows without scanning the whole table. It speeds up reads and adds cost to every write.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Performance</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">Sargable predicates</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">A predicate is sargable (Search-ARGument-able) when the database can use an index to evaluate it. That means the column must appear bare on one side: col = x, col &gt; x, col LIKE &#x27;abc%&#x27;.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Performance</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">EXPLAIN &amp; execution plans</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">The optimizer turns SQL into an execution plan: which indexes to use, the join order and the join methods (nested loop, hash, merge). EXPLAIN shows the plan and its estimated cost; EXPLAIN ANALYZE (PostgreSQL) also runs the query and shows the real timings.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Performance</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">Materialized views</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">A materialized view stores the result of a query physically, like a table, and is refreshed on demand or on a schedule. Reads are instant; the data is only as fresh as the last refresh.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Performance</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">Partitioning</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">Partitioning splits one logical table into physical pieces by a key (range of dates, list of regions, hash). Queries that filter on the key skip irrelevant partitions (partition pruning).</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Modern SQL</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">JSON in SQL</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">Both databases store and query JSON documents. The SQL/JSON standard functions JSON_VALUE (a scalar), JSON_QUERY (an object or array), JSON_TABLE (rows) and JSON_EXISTS work in Oracle 12c+ and PostgreSQL 17+. PostgreSQL also has jsonb operators (-&gt;, -&gt;&gt;, @&gt;) and GIN indexes.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Modern SQL</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">String functions</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">Common text functions exist in both databases with small differences: UPPER/LOWER/INITCAP, TRIM, LPAD/RPAD, REPLACE, SUBSTR, LENGTH, and concatenation with ||.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Modern SQL</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">DUAL &amp; SELECT without FROM</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">DUAL is Oracle&#x27;s one-row, one-column dummy table, used to evaluate expressions (SELECT SYSDATE FROM dual). PostgreSQL, and Oracle 23ai, simply allow SELECT without FROM.</p></div><span class="text-white/30">+</span></button></div><div class="panel overflow-hidden " style="opacity:0;transform:translateY(10px)"><button class="flex w-full items-start gap-3 p-4 text-left"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-[10px] font-bold uppercase tracking-[0.25em] text-[var(--accent)]">Modern SQL</span><span class="inline-flex items-center gap-1 rounded-[3px] border-2 px-2 font-display py-0.5 text-[11px] font-semibold tracking-wide " style="border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)">locked</span></div><div class="mt-1 font-display text-base font-bold blur-[3px]">PL/SQL vs PL/pgSQL</div><p class="mt-1 line-clamp-2 text-sm text-white/60 select-none blur-[4px]">Both databases include a procedural language for stored procedures, functions and triggers: PL/SQL (Oracle) and PL/pgSQL (PostgreSQL). They look similar (DECLARE / BEGIN / EXCEPTION / END) but differ in packages, error handling and cursors.</p></div><span class="text-white/30">+</span></button></div></div></main><!--$--><!--/$--><script src="/query-clash/_next/static/chunks/1j1rit-3-hei4.js" id="_R_" async=""></script><script>(self.__next_f=self.__next_f||[]).push([0])</script><script>self.__next_f.push([1,"1:\"$Sreact.fragment\"\n2:I[39756,[\"/query-clash/_next/static/chunks/0u02qm4i6dgq_.js\",\"/query-clash/_next/static/chunks/14mrh2-p_w84d.js\"],\"default\"]\n3:I[37457,[\"/query-clash/_next/static/chunks/0u02qm4i6dgq_.js\",\"/query-clash/_next/static/chunks/14mrh2-p_w84d.js\"],\"default\"]\n4:I[22016,[\"/query-clash/_next/static/chunks/0u02qm4i6dgq_.js\",\"/query-clash/_next/static/chunks/14mrh2-p_w84d.js\",\"/query-clash/_next/static/chunks/1rxncug86bump.js\"],\"\"]\n5:I[64576,[\"/query-clash/_next/static/chunks/0u02qm4i6dgq_.js\",\"/query-clash/_next/static/chunks/14mrh2-p_w84d.js\"],\"PwaRegister\"]\n6:I[47257,[\"/query-clash/_next/static/chunks/0u02qm4i6dgq_.js\",\"/query-clash/_next/static/chunks/14mrh2-p_w84d.js\"],\"ClientPageRoot\"]\n7:I[52291,[\"/query-clash/_next/static/chunks/0u02qm4i6dgq_.js\",\"/query-clash/_n
